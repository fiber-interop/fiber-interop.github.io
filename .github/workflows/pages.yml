name: site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Full history so path repositories see the v0.1.0 tags (api requires scope ^0.1).
      # Adapters use path repositories to ../api and ../scope, so all repos are siblings in work/.
      - uses: actions/checkout@v4
        with: { repository: fiber-interop/api, path: work/api, fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { repository: fiber-interop/scope, path: work/scope, fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { repository: fiber-interop/phasync, path: work/phasync, fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { repository: fiber-interop/revolt, path: work/revolt, fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { repository: fiber-interop/amp, path: work/amp, fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { repository: fiber-interop/react, path: work/react, fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { repository: fiber-interop/swoole, path: work/swoole, fetch-depth: 0 }

      - uses: actions/checkout@v4
        with: { repository: fiber-interop/ext-scope, path: work/ext-scope }

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, swoole
          tools: composer
          coverage: none

      - name: Install api, scope and adapters
        run: |
          # The packages depend on each other as ^0.1 from Packagist. Here we want the checked-out
          # main of every sibling instead: point each checkout at its siblings with path repositories
          # (api and scope alias dev-main as 0.1.x-dev, which satisfies ^0.1 at dev stability).
          for d in api scope phasync revolt amp react swoole; do
            echo "::group::composer update $d"
            (cd work/$d \
              && composer config minimum-stability dev \
              && composer config prefer-stable true \
              && for s in api scope; do [ "$s" = "$d" ] || composer config repositories.$s path ../$s; done \
              && composer update --no-interaction --no-progress) || echo "composer install failed for $d"
            echo "::endgroup::"
          done

      # Native extension, used only for the second pass of the scope probes (probes_ext in conformance.json).
      - name: Build ext-scope
        run: |
          cd work/ext-scope
          phpize && ./configure && make -j"$(nproc)"
          ls -l modules/scope.so

      - name: Run conformance for every adapter
        run: |
          composer install --no-interaction --no-progress
          php build/conformance.php "$PWD/work" "$PWD/conformance.json"
          cat conformance.json

      # Same swoole adapter, OpenSwoole extension instead of Swoole (never both loaded).
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, :swoole, openswoole
          tools: composer
          coverage: none

      - name: Run conformance for the swoole adapter on OpenSwoole
        run: |
          php -r 'exit(extension_loaded("openswoole") && !extension_loaded("swoole") ? 0 : 1);'
          php build/conformance.php "$PWD/work" "$PWD/conformance-openswoole.json" openswoole
          php -r '$a = json_decode(file_get_contents("conformance.json"), true); $b = json_decode(file_get_contents("conformance-openswoole.json"), true); $a["runtimes"] += $b["runtimes"]; file_put_contents("conformance.json", json_encode($a, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");'
          cat conformance-openswoole.json

      # Never publish a broken run: every runtime needs at least one passing example and (adapters) an ok api probe.
      - name: Check conformance results
        run: |
          php -r '$bad = []; foreach (json_decode(file_get_contents("conformance.json"), true)["runtimes"] as $n => $r) {
            if (!in_array("ok", $r["results"], true)) $bad[] = "$n: 0 examples pass (" . reset($r["results"]) . ")";
            if ($n !== "reference" && ($r["probes"]["api"] ?? null) !== "ok") $bad[] = "$n: api probe " . json_encode($r["probes"]["api"] ?? null);
          } if ($bad) { fwrite(STDERR, implode("\n", $bad) . "\n"); exit(1); }'

      - name: Build site
        run: php build/build.php remote

      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
      - id: deployment
        uses: actions/deploy-pages@v4
