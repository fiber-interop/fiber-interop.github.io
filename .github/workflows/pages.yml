name: site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Full history so path repositories see the v0.1.0 tags (api requires scope ^0.1).
      # Adapters use path repositories to ../api and ../scope, so all repos are siblings in work/.
      - uses: actions/checkout@v4
        with: { repository: fiber-interop/api, path: work/api, fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { repository: fiber-interop/scope, path: work/scope, fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { repository: fiber-interop/phasync, path: work/phasync, fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { repository: fiber-interop/revolt, path: work/revolt, fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { repository: fiber-interop/amp, path: work/amp, fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { repository: fiber-interop/react, path: work/react, fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { repository: fiber-interop/swoole, path: work/swoole, fetch-depth: 0 }

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, swoole
          tools: composer
          coverage: none

      - name: Install api, scope and adapters
        run: |
          # main is usually ahead of v0.1.0, and composer versions a path repository from an exact tag
          # on HEAD, otherwise as dev-main, which does not satisfy ^0.1. Tag HEAD locally (never pushed)
          # as 0.1.999 so the adapters resolve the checked-out main of api and scope.
          for d in api scope; do git -C work/$d tag -f v0.1.999; done
          for d in api scope phasync revolt amp react swoole; do
            echo "::group::composer update $d"
            (cd work/$d && composer update --no-interaction --no-progress) || echo "composer install failed for $d"
            echo "::endgroup::"
          done

      - name: Run conformance for every adapter
        run: |
          composer install --no-interaction --no-progress
          php build/conformance.php "$PWD/work" "$PWD/conformance.json"
          cat conformance.json

      - name: Build site
        run: php build/build.php remote

      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
      - id: deployment
        uses: actions/deploy-pages@v4
